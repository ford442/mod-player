name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# A new push to a PR supersedes the previous run; pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: ALSA runtime for node-web-audio-api (#453)
        # The vitest Web Audio harness (tests/helpers/webAudioNode.ts) is a native
        # addon linked against libasound.so.2. Only install it when the image lacks it.
        run: |
          if ! ldconfig -p | grep -q 'libasound\.so\.2'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends libasound2t64
          fi
      # The whole gate lives in package.json so CI and `npm run preflight` cannot drift apart:
      # lockfile guards, wasm/js-engine verification, generated-worklet freshness (#435), lint,
      # type checks (app, worklet, tests), unit tests, shader include/parity, build, and the
      # post-build CSS/WASM and bundle-budget checks. Needs no network after `npm ci`.
      - name: Preflight
        run: npm run preflight

  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up Playwright Chromium
        uses: ./.github/actions/setup-playwright

      - name: Build
        run: VITE_APP_BASE_PATH=/ npm run build

      - name: Start preview server
        run: |
          npm run preview -- --port 4173 --host 127.0.0.1 &
          echo $! > /tmp/preview.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then echo "preview ready"; exit 0; fi
            sleep 2
          done
          echo "preview failed to start"; exit 1

      - name: Visual smoke (HTML, CI profile)
        run: BASE_URL=http://127.0.0.1:4173 OUTPUT_DIR=./artifacts/visual-smoke npm run smoke:visual:ci

      - name: Upload smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-smoke-failure
          path: artifacts/visual-smoke/
          retention-days: 5

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/preview.pid ]; then kill $(cat /tmp/preview.pid) 2>/dev/null || true; fi

  # Best-effort WebGPU coverage, split out of visual-smoke so it runs in parallel: it was ~60 s of that
  # job's ~4 min and nothing depends on its result (the step is continue-on-error, so this job always
  # ends green; the screenshots are uploaded for inspection).
  visual-smoke-webgpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up Playwright Chromium
        uses: ./.github/actions/setup-playwright

      - name: Build
        run: VITE_APP_BASE_PATH=/ npm run build

      - name: Start preview server
        run: |
          npm run preview -- --port 4173 --host 127.0.0.1 &
          echo $! > /tmp/preview-webgpu.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then echo "preview ready"; exit 0; fi
            sleep 2
          done
          echo "preview failed to start"; exit 1

      - name: Visual smoke (WebGPU coverage — experimental, continue-on-error)
        # WebGPU coverage assertions run here as a best-effort check.
        # Headless WebGPU compositor flakiness is known on Linux/SwiftShader; this step
        # is marked continue-on-error until it has demonstrated stability across ≥5 CI runs.
        # Promotion path: once it passes reliably, remove continue-on-error and add
        # an upload-on-failure step for the webgpu artifacts.
        # See docs/VISUAL_SMOKE.md § "WebGPU promotion path".
        continue-on-error: true
        id: webgpu-coverage
        run: |
          BASE_URL=http://127.0.0.1:4173 \
          OUTPUT_DIR=./artifacts/visual-smoke-webgpu \
          SMOKE_PROFILE=full \
          RENDERERS=webgpu \
          SHADER_FILES=patternv0.52.wgsl,patternv0.53.wgsl,patternv0.54.wgsl \
          MODULE_URLS=/4-mat_madness.mod \
          SEEK_ROWS=8 \
          LITE_MODES=0 \
          npm run smoke:visual

      - name: Upload WebGPU coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-smoke-webgpu-coverage
          path: artifacts/visual-smoke-webgpu/
          retention-days: 5
          if-no-files-found: ignore

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/preview-webgpu.pid ]; then kill $(cat /tmp/preview-webgpu.pid) 2>/dev/null || true; fi

  audio-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up Playwright Chromium
        uses: ./.github/actions/setup-playwright

      - name: Build
        run: VITE_APP_BASE_PATH=/ npm run build

      - name: Start preview server
        run: |
          npm run preview -- --port 4173 --host 127.0.0.1 &
          echo $! > /tmp/preview-audio.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then echo "preview ready"; exit 0; fi
            sleep 2
          done
          echo "preview failed to start"; exit 1

      - name: Audio smoke (JS worklet product flow)
        run: BASE_URL=http://127.0.0.1:4173 OUTPUT_DIR=./artifacts/audio-smoke npm run smoke:audio:ci

      - name: FX rack harness (#453 — bypass null, crossfades, parity, character CPU)
        # Chrome's Web Audio: the same scenarios as the vitest Web Audio tests,
        # plus the character worklet's CPU share (< 5 % of one core at 48 kHz).
        run: BASE_URL=http://127.0.0.1:4173 OUTPUT_DIR=./artifacts/fx-smoke npm run smoke:fx:ci

      - name: Upload audio smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: audio-smoke-failure
          path: |
            artifacts/audio-smoke/
            artifacts/fx-smoke/
          retention-days: 5

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/preview-audio.pid ]; then kill $(cat /tmp/preview-audio.pid) 2>/dev/null || true; fi

  playhead-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up Playwright Chromium
        uses: ./.github/actions/setup-playwright

      - name: Build
        run: VITE_APP_BASE_PATH=/ npm run build

      - name: Start preview server
        run: |
          npm run preview -- --port 4173 --host 127.0.0.1 &
          echo $! > /tmp/preview-playhead.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then echo "preview ready"; exit 0; fi
            sleep 2
          done
          echo "preview failed to start"; exit 1

      - name: Playhead acceptance (JS worklet)
        run: BASE_URL=http://127.0.0.1:4173 OUTPUT_DIR=./artifacts/playhead-acceptance AUDIO_ENGINE=js npm run smoke:playhead

      - name: Upload playhead artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playhead-smoke-failure
          path: artifacts/playhead-acceptance/
          retention-days: 5

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/preview-playhead.pid ]; then kill $(cat /tmp/preview-playhead.pid) 2>/dev/null || true; fi

  wasm-smoke-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      # Pin must match scripts/build-wasm.sh EMSDK_PIN and docs
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.51'
      
      - name: Verify emcc
        run: emcc --version
      
      - name: Check native build script (canonical path)
        run: |
          if [ ! -f scripts/build-wasm.sh ]; then echo "❌ scripts/build-wasm.sh missing"; false; fi
          # Must not clobber tracked JS worklet
          if grep -E -- '-o[[:space:]]+public/worklets/openmpt-worklet' scripts/build-wasm.sh; then
            echo "❌ scripts/build-wasm.sh must not write openmpt-worklet.*"; false
          fi
          if grep -E 'rm[[:space:]]+-rf[[:space:]]+public/worklets' scripts/build-wasm.sh; then
            echo "❌ build scripts must not rm -rf public/worklets"; false
          fi
          echo "✅ Native build script present and safe"
      
      - name: Setup Node.js (for dependencies)
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Verify native EXPORTED_FUNCTIONS vs TS/C++
        run: npm run verify:native-exports
      
      # Full emcc link runs in native-full-build (path-filtered) + scheduled workflow.
      - name: Shellcheck / syntax-check build scripts
        # Findings fail the job. (This step used to be `shellcheck ... || true` behind a
        # "tool is installed" check, so it could never fail and silently skipped if shellcheck was absent.)
        # Gated at warning+: info/style notes (e.g. SC2015 on the deliberate `A && B || true` idiom)
        # differ between shellcheck versions, so gating on them would flap whenever the runner image updates.
        run: |
          command -v shellcheck >/dev/null || { echo "❌ shellcheck is not installed on this runner"; exit 1; }
          for f in scripts/build-wasm.sh scripts/build-js-libopenmpt.sh scripts/native-host-test.sh; do
            shellcheck --severity=warning "$f"
            bash -n "$f"
            echo "✅ $f clean"
          done
      
      - name: Guard tracked JS worklet still present
        run: |
          test -f public/worklets/openmpt-worklet.js
          grep -q 'registerProcessor\|AudioWorkletProcessor' public/worklets/openmpt-worklet.js
          echo "✅ Tracked JS worklet intact"

  # Rebuild the committed real-WASM libopenmpt pair (JS engine) with the pinned emsdk and fail on
  # drift. The build is byte-reproducible (verified from a clean tree: identical sha256, no absolute
  # paths embedded), so committed artifacts must equal a fresh build — same contract as the
  # generated JS worklet (#435). Path-filtered: only runs when its inputs change.
  js-libopenmpt-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect JS-engine libopenmpt path changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            jsengine:
              - 'scripts/build-js-libopenmpt.sh'
              - 'scripts/jsEngineArtifacts.mjs'
              - 'scripts/verify-js-libopenmpt.mjs'
              - 'public/worklets/libopenmpt-worklet.js'
              - 'public/worklets/libopenmpt-worklet.wasm'
              - 'audio-worklet/js/libopenmpt-worklet.generated.json'
              - '.github/workflows/ci.yml'

      - name: Setup Emscripten
        if: steps.filter.outputs.jsengine == 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.51'

      - name: Setup Node.js
        if: steps.filter.outputs.jsengine == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # libopenmpt.a for this variant is keyed by the build script (it owns every flag).
      - name: Cache libopenmpt static library (JS engine variant)
        if: steps.filter.outputs.jsengine == 'true'
        uses: actions/cache@v6
        with:
          path: vendor/libopenmpt-0.8.4+release-jsengine-eh-wasm-emsdk3.1.51
          key: libopenmpt-js-engine-${{ runner.os }}-emsdk-3.1.51-v0.8.4-${{ hashFiles('scripts/build-js-libopenmpt.sh') }}

      - name: Rebuild libopenmpt-worklet.{js,wasm} (emsdk 3.1.51)
        if: steps.filter.outputs.jsengine == 'true'
        run: bash scripts/build-js-libopenmpt.sh

      - name: Committed artifacts must equal a fresh build
        if: steps.filter.outputs.jsengine == 'true'
        run: |
          if ! git diff --exit-code -- public/worklets/libopenmpt-worklet.js public/worklets/libopenmpt-worklet.wasm audio-worklet/js/libopenmpt-worklet.generated.json; then
            echo "::error::libopenmpt-worklet.{js,wasm} drifted from scripts/build-js-libopenmpt.sh output. Run 'npm run build:js-libopenmpt' with emsdk 3.1.51 and commit the result."
            exit 1
          fi
          echo "✅ committed real-WASM libopenmpt matches a fresh emsdk 3.1.51 build"

      - name: Verify rebuilt artifacts
        if: steps.filter.outputs.jsengine == 'true'
        run: node scripts/verify-js-libopenmpt.mjs --smoke

  # Full native link when C++/build/audio-worklet surfaces change.
  # Uses cached libopenmpt.a so PR wall time stays reasonable on cache hits.
  native-full-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect native-related path changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            native:
              - 'cpp/**'
              - 'scripts/build-wasm.sh'
              - 'scripts/playhead-acceptance.mjs'
              - 'audio-worklet/**'
              - 'hooks/useAudioGraph.ts'
              - 'hooks/audioGraph/**'
              - 'utils/nativeClockAnchor.ts'
              - 'utils/nativeParityGate.ts'
              - 'utils/workletPositionAdapter.ts'
              - 'utils/audioContextFactory.ts'
              - '.github/workflows/ci.yml'
              - '.github/workflows/native-wasm-scheduled.yml'

      - name: Setup Emscripten
        if: steps.filter.outputs.native == 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.51'

      - name: Setup Node.js
        if: steps.filter.outputs.native == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.filter.outputs.native == 'true'
        run: npm ci

      # The stamp covers mode, emsdk pin, libopenmpt version and every flag that shapes libopenmpt.a
      # (scripts/build-wasm.sh). Printing it needs no toolchain.
      - name: Compute libopenmpt flag stamp (release)
        id: libopenmpt_stamp
        if: steps.filter.outputs.native == 'true'
        run: |
          stamp="$(bash scripts/build-wasm.sh --print-flag-stamp)"
          if [[ ! "$stamp" =~ ^[0-9a-f]{16}$ ]]; then echo "❌ unexpected flag stamp: '$stamp'" >&2; exit 1; fi
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"

      - name: Cache libopenmpt static library
        if: steps.filter.outputs.native == 'true'
        uses: actions/cache@v6
        with:
          path: vendor/libopenmpt-0.8.4+release-native-release
          # Exact key only — NO restore-keys. A prefix fallback restored a libopenmpt.a built with
          # other flags, and the build script then trusted whatever archive it found.
          key: libopenmpt-native-${{ runner.os }}-release-${{ steps.libopenmpt_stamp.outputs.stamp }}

      - name: Snapshot tracked JS worklet
        if: steps.filter.outputs.native == 'true'
        run: |
          test -f public/worklets/openmpt-worklet.js
          cksum public/worklets/openmpt-worklet.js | tee /tmp/worklet-before.cksum
          grep -q 'registerProcessor\|AudioWorkletProcessor' public/worklets/openmpt-worklet.js

      - name: Verify native exports
        if: steps.filter.outputs.native == 'true'
        run: npm run verify:native-exports

      - name: Build native engine (full emcc link)
        if: steps.filter.outputs.native == 'true'
        run: npm run build:emcc

      - name: Assert tracked JS worklet unchanged
        if: steps.filter.outputs.native == 'true'
        run: |
          cksum public/worklets/openmpt-worklet.js | tee /tmp/worklet-after.cksum
          diff /tmp/worklet-before.cksum /tmp/worklet-after.cksum
          grep -q 'registerProcessor\|AudioWorkletProcessor' public/worklets/openmpt-worklet.js
          echo "✅ Tracked JS worklet intact after native build"

      - name: Verify native artifacts
        if: steps.filter.outputs.native == 'true'
        run: |
          for f in public/worklets/openmpt-native.js public/worklets/openmpt-native.wasm public/worklets/openmpt-native.aw.js; do
            if [ ! -f "$f" ]; then echo "❌ missing $f"; false; fi
          done
          head -c 4 public/worklets/openmpt-native.wasm | od -An -tx1 | grep -q '00 61 73 6d'
          echo "✅ openmpt-native.* artifacts present"

      - name: Verify native SIMD survived the link
        if: steps.filter.outputs.native == 'true'
        run: npm run verify:native-simd

      - name: Upload native artifacts
        if: steps.filter.outputs.native == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: openmpt-native-pr-emsdk-3.1.51
          path: |
            public/worklets/openmpt-native.js
            public/worklets/openmpt-native.wasm
            public/worklets/openmpt-native.aw.js
          retention-days: 7

      - name: Install Playwright Chromium
        if: steps.filter.outputs.native == 'true'
        run: npx playwright install chromium --with-deps

      - name: Start preview for native playhead parity
        if: steps.filter.outputs.native == 'true'
        run: |
          VITE_APP_BASE_PATH=/ npm run build
          npm run preview -- --port 4173 --host 127.0.0.1 &
          echo $! > /tmp/preview-native-playhead.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then echo "preview ready"; exit 0; fi
            sleep 2
          done
          echo "preview failed to start"; exit 1

      - name: Playhead acceptance (native engine parity)
        if: steps.filter.outputs.native == 'true'
        run: |
          BASE_URL=http://127.0.0.1:4173 \
          OUTPUT_DIR=./artifacts/playhead-acceptance-native \
          AUDIO_ENGINE=native \
          npm run smoke:playhead

      - name: Upload native playhead artifacts on failure
        if: failure() && steps.filter.outputs.native == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playhead-native-smoke-failure
          path: artifacts/playhead-acceptance-native/
          retention-days: 7

      - name: Stop native preview server
        if: always() && steps.filter.outputs.native == 'true'
        run: |
          if [ -f /tmp/preview-native-playhead.pid ]; then kill $(cat /tmp/preview-native-playhead.pid) 2>/dev/null || true; fi

      - name: Skip full build (no native paths changed)
        if: steps.filter.outputs.native != 'true'
        run: echo "⏭️ Skipping full build:emcc — no cpp/scripts/audio-worklet path changes"

  # The native engine's C++ under host sanitizers (#491): Emscripten has no TSan for wasm, so
  # cpp/native_engine.cpp + cpp/openmpt_wrapper.cpp are built for the runner against a host
  # libopenmpt (instrumented the same way) and driven from two std::threads by cpp/host/.
  # ThreadSanitizer: 1000× "load B while A renders" + teardown race + a negative control that
  # must be reported; ASan+UBSan on the same paths; and an allocation count inside process().
  native-host-sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect native C++ path changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cpp:
              - 'cpp/**'
              - 'scripts/native-host-test.sh'
              - 'scripts/lib/corrupt-it.mjs'
              - 'scripts/lib/synth-xm.mjs'
              - 'tests/fixtures/minimal.it'
              - 'public/4-mat_madness.mod'
              - 'public/libopenmpt-test.mod'
              - '.github/workflows/ci.yml'

      - name: Setup Node.js
        if: steps.filter.outputs.cpp == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # One instrumented libopenmpt.a per flavour; the script re-stamps (and rebuilds) a tree
      # whose flags or compiler changed, so an exact key on the script is enough.
      - name: Cache host libopenmpt builds
        if: steps.filter.outputs.cpp == 'true'
        uses: actions/cache@v6
        with:
          path: |
            vendor/libopenmpt-0.8.4+release
            vendor/libopenmpt-0.8.4+release-host-tsan
            vendor/libopenmpt-0.8.4+release-host-asan
            vendor/libopenmpt-0.8.4+release-host-alloc
          key: libopenmpt-host-${{ runner.os }}-${{ hashFiles('scripts/native-host-test.sh') }}

      - name: Host sanitizer + allocation tests
        if: steps.filter.outputs.cpp == 'true'
        run: npm run test:native-host

      - name: Skip (no native C++ changes)
        if: steps.filter.outputs.cpp != 'true'
        run: echo "⏭️ Skipping host sanitizer tests — no cpp/ or harness changes"
